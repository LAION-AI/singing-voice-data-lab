[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "singing-voice-data-lab"
version = "0.1.0"
description = "Lead-vocal extraction, singing-note annotation and reversible MIDI tokens"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=2,<3", "scipy>=1.13,<2", "soundfile>=0.12", "mido>=1.3", "safetensors>=0.4", "PyYAML>=6", "huggingface-hub>=0.30", "filelock>=3"]

[project.optional-dependencies]
inference = ["torch>=2.6", "torchaudio>=2.6", "einops>=0.8", "beartype>=0.20", "rotary-embedding-torch>=0.8", "librosa>=0.10", "matplotlib>=3.8", "pretty-midi>=0.2.10", "textgrid>=1.6", "cmudict>=1", "pyworld>=0.3", "praat-parselmouth>=0.4", "pyloudnorm>=0.1", "lightning>=2.2", "tensorboardX>=2.6", "pyyaml>=6", "mir-eval>=0.8", "scikit-image>=0.23", "scikit-learn>=1.4", "webrtcvad-wheels>=2.0", "nltk>=3.9", "chardet>=5", "six>=1.16", "packaging>=23", "torchmetrics>=1.4", "setuptools>=69,<81"]
render = ["tinysoundfont==0.3.7"]
demo = ["gradio==5.49.1", "plotly>=6", "pandas>=2"]

[project.scripts]
singing-voice-lab = "lab:main"

[tool.setuptools]
py-modules = ["lab"]
